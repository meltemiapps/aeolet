name: Build and test
on: [push, pull_request]
jobs:
  pgp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: sudo apt-get install -y gnupg && gpg --version | head -1
      - working-directory: PGP/js
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm test
  ios:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Unit and UI tests (UI tests run against the in-app mock Gmail server)
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          # Boot first and wait until fully up: a cold boot inside the test run can time out UI test start-up.
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild test -project Aeolet.xcodeproj -scheme Aeolet -destination "id=$DEVICE" \
            -resultBundlePath TestResults.xcresult -retry-tests-on-failure -test-iterations 2 \
            GOOGLE_CLIENT_PREFIX=ci-placeholder DEVELOPMENT_TEAM=
          # No team on CI: there is no Apple account there, so the Simulator build is signed to run locally.
          # Signed for local running (the default): an unsigned Simulator app has no Keychain access,
          # so sign-in in the UI tests could never store its token.
      - name: Mock is absent from Release
        run: Scripts/check-release-excludes-mock.sh ios
      - name: Keep test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Mac unit and UI tests (UI tests run against the in-app mock Gmail server)
        run: |
          # No Apple account on CI: the app is signed to run locally, with the same sandbox entitlements
          # minus the Keychain access group, which needs a provisioning profile.
          xcodebuild test -project Aeolet.xcodeproj -scheme AeoletMac -destination "platform=macOS" \
            -resultBundlePath MacTestResults.xcresult -retry-tests-on-failure -test-iterations 2 \
            GOOGLE_CLIENT_PREFIX=ci-placeholder DEVELOPMENT_TEAM= CODE_SIGN_IDENTITY=- AEOLET_ENTITLEMENTS_SUFFIX=-Unsigned
      - name: Mock is absent from the Mac Release build
        run: Scripts/check-release-excludes-mock.sh mac
      - name: Keep test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-test-results
          path: MacTestResults.xcresult
          if-no-files-found: ignore
